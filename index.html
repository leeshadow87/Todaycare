<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘아이돌봄 v6 - 수도권 키즈 공간 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=64378d75cc0d8edba55553350f36c7d1&libraries=services,clusterer"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#f97316;--brand-light:#fff7ed;--brand-dark:#c2410c;--brand-soft:#fed7aa;
  --green:#16a34a;--green-light:#f0fdf4;
  --blue:#2563eb;--blue-light:#eff6ff;
  --purple:#7c3aed;--purple-light:#f5f3ff;
  --teal:#0d9488;--teal-light:#f0fdfa;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;--border2:#f1f5f9;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;--text4:#cbd5e1;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --shadow-brand:0 4px 20px rgba(249,115,22,0.25);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
.header{background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#f97316,#fb923c);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 8px rgba(249,115,22,0.3)}
.logo-text h1{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.3px}
.logo-text .logo-sub{font-size:10.5px;color:var(--text3);font-weight:500}
.header-actions{display:flex;align-items:center;gap:8px}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text);transition:all 0.18s;font-family:'Noto Sans KR',sans-serif;display:inline-flex;align-items:center;gap:4px}
.btn-sm:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:var(--brand-dark);color:#fff;border-color:var(--brand-dark)}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover{background:#0f766e;color:#fff;border-color:#0f766e}

/* SEARCH BAR */
.search-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;flex-shrink:0}
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.search-input-wrap{flex:1;position:relative}
.search-input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color 0.15s;background:#f8fafc}
.search-input:focus{border-color:var(--brand);background:#fff}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3)}
.btn-search{padding:9px 18px;border-radius:9px;background:var(--brand);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:background 0.15s;white-space:nowrap}
.btn-search:hover{background:var(--brand-dark)}
.status-badge{font-size:11.5px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}

/* FILTERS */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;color:var(--text3);font-weight:600;padding:0 4px}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);transition:all 0.15s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.filter-btn:hover{border-color:var(--brand);color:var(--brand)}
.filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.filter-btn.active-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-divider{width:1px;height:16px;background:var(--border);margin:0 2px}

/* CAT FILTERS */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cat-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);transition:all 0.15s;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:4px;white-space:nowrap}
.cat-btn:hover,.cat-btn.active{border-color:var(--brand);background:var(--brand);color:#fff}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden;position:relative}
.list-panel{width:380px;min-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:#fff;flex-shrink:0}
.list-header{padding:10px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.list-count{font-size:12px;color:var(--text2);font-weight:500}
.view-toggle{display:flex;gap:4px}
.view-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text3);font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.view-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.list-inner{flex:1;overflow-y:auto;padding:8px}
.list-inner::-webkit-scrollbar{width:4px}
.list-inner::-webkit-scrollbar-track{background:transparent}
.list-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* PLACE CARD */
.place-card{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;background:#fff;position:relative}
.place-card:hover{border-color:var(--brand);box-shadow:0 2px 12px rgba(249,115,22,0.12);transform:translateY(-1px)}
.place-card.selected{border-color:var(--brand);background:var(--brand-light);box-shadow:0 2px 16px rgba(249,115,22,0.2)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-name{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3}
.card-badge{padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge-library{background:#eff6ff;color:#1d4ed8}
.badge-childcare{background:#f0fdf4;color:#15803d}
.badge-kakao{background:#fff7ed;color:#c2410c}
.badge-public{background:#f5f3ff;color:#6d28d9}
.card-addr{font-size:11.5px;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.card-info-row{display:flex;gap:8px;flex-wrap:wrap}
.card-info-item{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px}
.card-source{font-size:10px;color:var(--text4);margin-top:4px}
.card-actions{display:flex;gap:5px;margin-top:8px}
.card-action-btn{flex:1;padding:5px 0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;text-align:center}
.card-action-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.card-action-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.card-action-btn.primary:hover{background:var(--brand-dark)}

/* DETAIL PANEL */
.detail-panel{position:absolute;left:380px;top:0;width:360px;height:100%;background:#fff;border-right:1px solid var(--border);z-index:50;transform:translateX(-760px);transition:transform 0.25s ease;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.08)}
.detail-panel.open{transform:translateX(0) !important}
.detail-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.detail-title{font-size:15px;font-weight:800;color:var(--text)}
.btn-close{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2);transition:all 0.15s}
.btn-close:hover{background:var(--bg);border-color:var(--text2)}
.detail-body{padding:16px}
.detail-section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border2)}
.detail-section:last-child{border-bottom:none}
.detail-section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.detail-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.detail-label{font-size:12px;color:var(--text3);min-width:70px;padding-top:1px;font-weight:500}
.detail-val{font-size:12.5px;color:var(--text);flex:1;line-height:1.4}
.detail-val a{color:var(--blue);text-decoration:none}
.detail-val a:hover{text-decoration:underline}
.hours-table{width:100%;border-collapse:collapse;font-size:12px}
.hours-table td{padding:5px 8px;border:1px solid var(--border2)}
.hours-table td:first-child{color:var(--text3);font-weight:500;background:var(--bg);width:60px}
.hours-table td:last-child{color:var(--text);font-weight:600}
.tag-row{display:flex;gap:5px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.source-note{font-size:11px;color:var(--text3);padding:8px 12px;background:var(--bg);border-radius:8px;margin-top:8px}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.detail-action-btn{padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;text-align:center}
.detail-action-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.detail-action-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);grid-column:1/-1}
.detail-action-btn.primary:hover{background:var(--brand-dark)}

/* MAP */
.map-panel{flex:1;position:relative;height:100%;overflow:hidden}
#kakao-map{width:100%;height:100%;min-height:400px}
.map-controls{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:flex-end}
.map-ctrl-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.12);font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;display:flex;align-items:center;gap:4px}
.map-ctrl-btn:hover{background:var(--brand);color:#fff}
.map-ctrl-btn.active{background:var(--brand);color:#fff}
.map-info-box{position:absolute;bottom:12px;left:12px;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,0.12);font-size:12px;color:var(--text2);display:flex;gap:12px;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.2)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10;border-radius:16px 16px 0 0}
.modal-title{font-size:17px;font-weight:800;color:var(--text)}
.modal-body{padding:22px}
.form-section{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border2)}
.form-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.form-section-title{font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2)}
.form-label .required{color:var(--brand);margin-left:2px}
.form-input,.form-select,.form-textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color 0.15s;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--brand);background:#fff}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text4)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5}
.form-hint{font-size:11px;color:var(--text3);margin-top:3px}
.time-group{display:flex;align-items:center;gap:6px}
.time-sep{font-size:12px;color:var(--text3);white-space:nowrap}
.checkbox-group{display:flex;flex-wrap:wrap;gap:6px}
.checkbox-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:5px 10px;border-radius:7px;border:1.5px solid var(--border);transition:all 0.15s;font-size:12px;color:var(--text2)}
.checkbox-item:hover{border-color:var(--brand);color:var(--brand)}
.checkbox-item input{display:none}
.checkbox-item.checked{background:var(--brand-light);border-color:var(--brand);color:var(--brand);font-weight:600}
.price-row{display:flex;align-items:center;gap:8px}
.price-unit{font-size:12px;color:var(--text3)}
.form-footer{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.btn-cancel{flex:1;padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-submit{flex:2;padding:12px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:var(--brand);color:#fff;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;box-shadow:var(--shadow-brand)}
.btn-submit:hover{background:var(--brand-dark)}
.photo-upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg)}
.photo-upload-area:hover{border-color:var(--brand);background:var(--brand-light)}
.photo-upload-area .upload-icon{font-size:28px;margin-bottom:8px}
.photo-upload-area .upload-text{font-size:13px;color:var(--text3)}
.photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border)}
.star-rating{display:flex;gap:4px}
.star{font-size:24px;cursor:pointer;color:var(--text4);transition:color 0.15s}
.star.active{color:#f59e0b}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.no-results{text-align:center;padding:40px 20px;color:var(--text3)}
.no-results-icon{font-size:32px;margin-bottom:10px}

/* MOBILE */
.mobile-fab{display:none;position:fixed;bottom:20px;right:20px;z-index:200;width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(249,115,22,0.4);align-items:center;justify-content:center;transition:all 0.2s}
@media(max-width:640px){
  .mobile-fab{display:flex}
  .list-panel{width:100%}
  .map-panel{display:none}
  .detail-panel{width:100%;left:0}
  .form-row{grid-template-columns:1fr}
  .form-row.three{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">🧸</div>
    <div class="logo-text">
      <h1>오늘아이돌봄</h1>
      <div class="logo-sub">수도권 키즈 공간 지도</div>
    </div>
  </div>
  <div class="header-actions">
    <span style="font-size:11px;color:var(--text3);padding:4px 10px;background:var(--green-light);border-radius:20px;color:var(--green);font-weight:600">📋 공공데이터 연동</span>
    <button class="btn-sm" onclick="window.open('https://www.privacy.go.kr','_blank')">개인정보처리방침</button>
    <button class="btn-sm btn-primary" onclick="openRegisterModal()">+ 업체 등록</button>
  </div>
</div>

<!-- SEARCH BAR -->
<div class="search-bar">
  <div class="search-row">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="업체명 또는 지역으로 검색..." oninput="onSearch()" onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <button class="btn-search" onclick="doSearch()">검색</button>
    <span class="status-badge" id="status-badge">✅ <span id="status-text">로딩 중...</span></span>
  </div>
  <div class="filter-row">
    <span class="filter-label">지역</span>
    <button class="filter-btn active" onclick="setSido('')" id="sido-all">전체</button>
    <button class="filter-btn" onclick="setSido('서울특별시')" id="sido-seoul">서울</button>
    <button class="filter-btn" onclick="setSido('경기도')" id="sido-gyeonggi">경기</button>
    <button class="filter-btn" onclick="setSido('인천광역시')" id="sido-incheon">인천</button>
    <div class="filter-divider"></div>
    <span class="filter-label">구/시</span>
    <div id="gu-filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="cat-row">
    <button class="cat-btn active" onclick="setCat('')" id="cat-all">전체</button>
    <button class="cat-btn" onclick="setCat('library')" id="cat-library">📚 도서관</button>
    <button class="cat-btn" onclick="setCat('kidscafe')" id="cat-kidscafe">🎠 키즈카페</button>
    <button class="cat-btn" onclick="setCat('experience')" id="cat-experience">🎨 체험센터</button>
    <button class="cat-btn" onclick="setCat('childcare')" id="cat-childcare">👶 시간제보육</button>
    <button class="cat-btn" onclick="setCat('support')" id="cat-support">🏠 육아지원센터</button>
    <button class="cat-btn" onclick="setCat('public')" id="cat-public">🏛️ 공공시설</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- LIST -->
  <div class="list-panel" id="list-panel">
    <div class="list-header">
      <span class="list-count" id="list-count">총 0개 장소</span>
      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('split')" id="view-split">분할</button>
        <button class="view-btn" onclick="setView('map')" id="view-map">지도</button>
        <button class="view-btn" onclick="setView('list')" id="view-list">목록</button>
      </div>
    </div>
    <div class="list-inner" id="list-inner"></div>
  </div>

  <!-- DETAIL -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <span class="detail-title" id="detail-title">상세정보</span>
      <button class="btn-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <!-- MAP -->
  <div class="map-panel" id="map-panel">
    <div id="kakao-map"></div>
    <div class="map-controls">
      <button class="map-ctrl-btn active" id="cluster-btn" onclick="toggleCluster()">🔵 클러스터 ON</button>
      <button class="map-ctrl-btn" onclick="centerMap()">📍 결과 중심</button>
    </div>

function libToPlace(arr, idx) {
  return {
    id: 'lib_'+idx,
    name: arr[0],
    category: 'library',
    subtype: arr[1],
    address: arr[2],
    tel: arr[3],
    lat: arr[4],
    lng: arr[5],
    weekday: arr[6],
    saturday: arr[7],
    holiday: arr[8],
    closed: arr[9],
    homepage: arr[10],
    seats: arr[11],
    sido: arr[12],
    sigungu: arr[13] ? arr[13].trim() : '',
    price: '무료',
    source: 'public',
    priceType: 'free'
  };
}

// 필터
// ═══════════════════════════════
function setSido(sido) {
  filters.sido = sido;
  filters.gu = '';
  document.querySelectorAll('[id^=sido-]').forEach(b => b.classList.remove('active'));
  const map = {'':'all','서울특별시':'seoul','경기도':'gyeonggi','인천광역시':'incheon'};
  const el = document.getElementById('sido-'+(map[sido]||'all'));
  if(el) el.classList.add('active');
  updateGuFilters();
  applyFiltersAndKakao();
}

function setGu(gu) {
  filters.gu = gu;
  document.querySelectorAll('.gu-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFiltersAndKakao();
}

function setCat(cat) {
  filters.cat = cat;
  document.querySelectorAll('[id^=cat-]').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('cat-'+(cat||'all'));
  if(el) el.classList.add('active');
  applyFiltersAndKakao();
}

function updateGuFilters() {
  const container = document.getElementById('gu-filters');
  if(!filters.sido) { container.innerHTML=''; return; }
  const gus = [...new Set(allPlaces.filter(p=>p.sido===filters.sido).map(p=>p.sigungu))].sort();
  container.innerHTML = `<button class="filter-btn gu-btn ${!filters.gu?'active':''}" onclick="setGu('')" style="color:var(--text2)">전체</button>` +
    gus.map(g=>`<button class="filter-btn gu-btn ${filters.gu===g?'active':''}" onclick="setGu('${g}')">${g}</button>`).join('');
}

function onSearch() {
  filters.keyword = document.getElementById('search-input').value.trim().toLowerCase();
  if(!filters.keyword) { applyFiltersAndKakao(); return; }
  applyFiltersLocal();
}

function doSearch() {
  filters.keyword = document.getElementById('search-input').value.trim().toLowerCase();
  applyFiltersAndKakao();
}

// ═══════════════════════════════
// 필터 + 카카오 검색
// ═══════════════════════════════
function applyFiltersAndKakao() {
  applyFiltersLocal();
  // 카카오 카테고리면 실시간 검색
  if(filters.cat && filters.cat !== 'library') {
    searchKakao();
  } else if(!filters.cat) {
    searchKakao();
  }
}

function applyFiltersLocal() {
  let result = [...allPlaces, ...kakaoPlaces];
  if(filters.cat) result = result.filter(p=>p.category===filters.cat);
  if(filters.sido) result = result.filter(p=>p.sido===filters.sido);
  if(filters.gu) result = result.filter(p=>p.sigungu===filters.gu);
  if(filters.keyword) result = result.filter(p=>
    p.name.toLowerCase().includes(filters.keyword) ||
    (p.address||'').toLowerCase().includes(filters.keyword)
  );
  displayPlaces = result;
  renderList();
  updateMarkers();
  document.getElementById('list-count').textContent = `총 ${result.length.toLocaleString()}개 장소`;
  document.getElementById('status-text').textContent = `${result.length.toLocaleString()}개 장소 표시 중`;
}

  '': ['키즈카페','어린이체험관','육아종합지원센터']
};

let kakaoPS = null;
function getPS() {
  if(!kakaoPS && window.kakao && kakao.maps && kakao.maps.services) {
    kakaoPS = new kakao.maps.services.Places();
  }
  return kakaoPS;
}

function searchKakao() {
  if(!mapReady) return;
  const ps = getPS();
  if(!ps) return;
  const keywords = KAKAO_KEYWORDS[filters.cat] || KAKAO_KEYWORDS[''];
  const region = filters.sido === '서울특별시' ? '서울' : filters.sido === '경기도' ? '경기' : filters.sido === '인천광역시' ? '인천' : '수도권';
  kakaoPlaces = [];
  let pending = keywords.length;
  keywords.forEach(kw => {
    ps.keywordSearch(`${region} ${kw}`, (data, status) => {
      if(status === kakao.maps.services.Status.OK) {
        data.forEach(item => {
          const cat = guessCat(item.category_name, item.place_name);
          if(cat !== 'library') {
            kakaoPlaces.push({
              id: 'kakao_'+item.id,
              name: item.place_name,
              category: cat,
              address: item.road_address_name || item.address_name,
              tel: item.phone,
              lat: parseFloat(item.y),
              lng: parseFloat(item.x),
              homepage: item.place_url,
              sido: getSido(item.address_name),
              sigungu: getSigungu(item.address_name),
              price: '업체 문의',
              source: 'kakao',
              kakaoUrl: item.place_url
            });
          }
        });
      }
      pending--;
      if(pending === 0) applyFiltersLocal();
    }, { size: 15 });
  });
}

function guessCat(catName, placeName) {
  if(catName.includes('도서관') || placeName.includes('도서관')) return 'library';
  if(placeName.includes('키즈카페') || catName.includes('키즈')) return 'kidscafe';
  if(placeName.includes('체험') || catName.includes('체험')) return 'experience';
  if(placeName.includes('보육') || catName.includes('보육')) return 'childcare';
  if(placeName.includes('육아') || placeName.includes('지원센터')) return 'support';
  if(catName.includes('유치원') || catName.includes('어린이집')) return 'public';
  return 'kidscafe';
}

function getSido(addr) {
  if(addr.includes('서울')) return '서울특별시';
  if(addr.includes('경기')) return '경기도';
  if(addr.includes('인천')) return '인천광역시';
  return '';
}

function getSigungu(addr) {
  const parts = addr.split(' ');
  return parts.length > 1 ? parts[1] : '';
}

// ═══════════════════════════════
// 카카오맵 초기화
// ═══════════════════════════════
function initKakaoMap() {
  const container = document.getElementById('kakao-map');
  kakaoMap = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 8
  });
  kakaoClusterer = new kakao.maps.MarkerClusterer({
    map: kakaoMap, averageCenter: true, minLevel: 5,
    disableClickZoom: false,
    styles: [
      {width:'44px',height:'44px',background:'rgba(249,115,22,0.85)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'44px',fontSize:'13px',fontWeight:'700',fontFamily:"'Noto Sans KR',sans-serif",boxShadow:'0 2px 8px rgba(0,0,0,0.2)'},
      {width:'52px',height:'52px',background:'rgba(249,115,22,0.9)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'52px',fontSize:'14px',fontWeight:'700',fontFamily:"'Noto Sans KR',sans-serif",boxShadow:'0 2px 12px rgba(0,0,0,0.25)'},
      {width:'60px',height:'60px',background:'rgba(220,80,10,0.95)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'60px',fontSize:'15px',fontWeight:'800',fontFamily:"'Noto Sans KR',sans-serif",boxShadow:'0 4px 16px rgba(0,0,0,0.3)'}
    ]
  });
  mapReady = true;
  applyFiltersAndKakao();
}

// ═══════════════════════════════
// 마커
// ═══════════════════════════════
function updateMarkers() {
  if(!mapReady) return;
  kakaoMarkers.forEach(m => m.setMap(null));
  kakaoMarkers = [];
  if(kakaoClusterer) kakaoClusterer.clear();
  if(openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; }

  displayPlaces.forEach(place => {
    if(!place.lat || !place.lng) return;
    const color = CAT_COLOR[place.category] || '#94a3b8';
    const emoji = CAT_EMOJI[place.category] || '📍';
    const content = `<div style="width:34px;height:34px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.2);border:2px solid #fff;cursor:pointer">${emoji}</div>`;
    const marker = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(place.lat, place.lng),
      content: content,
      yAnchor: 1
    });

    const el = document.createElement('div');
    el.innerHTML = content;
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => selectPlace(place.id));

    const markerReal = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(place.lat, place.lng),
      title: place.name
    });
    markerReal.setMap(null);
    kakaoMarkers.push(markerReal);

    const overlay = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(place.lat, place.lng),
      content: `<div onclick="selectPlace('${place.id}')" style="width:32px;height:32px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.2);border:2px solid #fff;cursor:pointer">${emoji}</div>`,
      yAnchor: 1.2
    });
    overlay.setMap(kakaoMap);
    kakaoMarkers.push({ setMap: (m) => overlay.setMap(m), position: markerReal.getPosition() });
  });

  if(clusterOn) {
    const realMarkers = displayPlaces.filter(p=>p.lat&&p.lng).map(p=>{
      const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(p.lat, p.lng) });
      kakao.maps.event.addListener(m, 'click', () => selectPlace(p.id));
      return m;
    });
    if(kakaoClusterer) kakaoClusterer.addMarkers(realMarkers);
  }
}

function toggleCluster() {
  clusterOn = !clusterOn;
  const btn = document.getElementById('cluster-btn');
  btn.textContent = clusterOn ? '🔵 클러스터 ON' : '⚪ 클러스터 OFF';
  btn.classList.toggle('active', clusterOn);
  updateMarkers();
}

function centerMap() {
  if(!mapReady || displayPlaces.length === 0) return;
  const lats = displayPlaces.filter(p=>p.lat).map(p=>p.lat);
  const lngs = displayPlaces.filter(p=>p.lng).map(p=>p.lng);
  const clat = (Math.max(...lats)+Math.min(...lats))/2;
  const clng = (Math.max(...lngs)+Math.min(...lngs))/2;
  kakaoMap.setCenter(new kakao.maps.LatLng(clat, clng));
}

// ═══════════════════════════════
// 리스트 렌더
// ═══════════════════════════════
function renderList() {
  const inner = document.getElementById('list-inner');
  if(displayPlaces.length === 0) {
    inner.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><p style="font-weight:700">장소가 없어요</p><p style="font-size:11px;color:var(--text3);margin-top:4px">다른 조건으로 검색해보세요</p></div>`;
    return;
  }
  inner.innerHTML = displayPlaces.map(p => {
    const badgeClass = p.category === 'library' ? 'badge-library' : p.source === 'public' ? 'badge-public' : p.source === 'kakao' ? 'badge-kakao' : 'badge-childcare';
    const isOpen = isOpenNow(p);
    return `<div class="place-card${selectedId===p.id?' selected':''}" onclick="selectPlace('${p.id}')">
      <div class="card-top">
        <div class="card-name">${p.name}</div>
        <span class="card-badge ${badgeClass}">${CAT_EMOJI[p.category]||'📍'} ${CAT_LABEL[p.category]||p.category}</span>
      </div>
      <div class="card-addr">📍 ${p.address||'-'}</div>
      <div class="card-info-row">
        ${p.tel ? `<span class="card-info-item">📞 ${p.tel}</span>` : ''}
        ${p.weekday ? `<span class="card-info-item">🕐 ${p.weekday}</span>` : ''}
        ${p.price ? `<span class="card-info-item" style="color:${p.priceType==='free'?'var(--green)':'var(--brand)'}">💰 ${p.price}</span>` : ''}
        ${p.source==='public' ? `<span class="card-info-item" style="color:var(--green);font-size:10px">✅ 공공데이터</span>` : ''}
      </div>
      <div class="card-actions">
        <button class="card-action-btn" onclick="event.stopPropagation();if('${p.tel}')location.href='tel:${p.tel}'">📞 전화</button>
        ${p.kakaoUrl||p.homepage ? `<button class="card-action-btn" onclick="event.stopPropagation();window.open('${p.kakaoUrl||p.homepage}','_blank')">🗺️ 지도</button>` : ''}
        <button class="card-action-btn primary" onclick="event.stopPropagation();selectPlace('${p.id}')">상세보기</button>
      </div>
    </div>`;
  }).join('');
}

function isOpenNow(p) {
  if(!p.weekday) return null;
  const now = new Date();
  const day = now.getDay();
  const hm = now.getHours()*60+now.getMinutes();
  let range = p.weekday;
  if(day === 6) range = p.saturday || p.weekday;
  if(day === 0) range = p.holiday || p.weekday;
  if(!range || range === '00:00~00:00') return false;
  const [s,e] = range.split('~').map(t=>{const [h,m]=t.split(':').map(Number);return h*60+m;});
  return hm >= s && hm <= e;
}

// ═══════════════════════════════
// 상세
// ═══════════════════════════════
function selectPlace(id) {
  selectedId = id;
  const place = displayPlaces.find(p=>p.id===id);
  if(!place) return;

  // 카드 하이라이트
  document.querySelectorAll('.place-card').forEach(c=>c.classList.remove('selected'));
  const card = [...document.querySelectorAll('.place-card')].find(c=>c.onclick?.toString().includes(`'${id}'`));

  // 지도 이동
  if(mapReady && place.lat && place.lng) {
    kakaoMap.setCenter(new kakao.maps.LatLng(place.lat, place.lng));
    kakaoMap.setLevel(4);
  }

  // 상세 패널
  document.getElementById('detail-title').textContent = place.name;
  const body = document.getElementById('detail-body');

  const hoursHtml = place.weekday ? `
    <table class="hours-table">
      <tr><td>평일</td><td>${place.weekday||'-'}</td></tr>
      <tr><td>토요일</td><td>${place.saturday||'-'}</td></tr>
      <tr><td>공휴일</td><td>${place.holiday||'-'}</td></tr>
      ${place.closed?`<tr><td>휴관일</td><td>${place.closed}</td></tr>`:''}
    </table>` : '<p style="font-size:12px;color:var(--text3)">운영시간 정보 없음</p>';

  body.innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">기본 정보</div>
      ${place.address?`<div class="detail-row"><div class="detail-label">주소</div><div class="detail-val">${place.address}</div></div>`:''}
      ${place.tel?`<div class="detail-row"><div class="detail-label">전화</div><div class="detail-val"><a href="tel:${place.tel}">${place.tel}</a></div></div>`:''}
      ${place.homepage?`<div class="detail-row"><div class="detail-label">홈페이지</div><div class="detail-val"><a href="${place.homepage}" target="_blank">바로가기 ↗</a></div></div>`:''}
      <div class="detail-row"><div class="detail-label">요금</div><div class="detail-val" style="color:${place.priceType==='free'?'var(--green)':'var(--brand)'};font-weight:600">${place.price||'-'}</div></div>
      ${place.subtype?`<div class="detail-row"><div class="detail-label">유형</div><div class="detail-val">${place.subtype}</div></div>`:''}
      ${place.seats?`<div class="detail-row"><div class="detail-label">좌석수</div><div class="detail-val">${parseInt(place.seats).toLocaleString()}석</div></div>`:''}
      ${place.books?`<div class="detail-row"><div class="detail-label">도서수</div><div class="detail-val">${parseInt(place.books).toLocaleString()}권</div></div>`:''}
    </div>
    <div class="detail-section">
      <div class="detail-section-title">운영 시간</div>
      ${hoursHtml}
    </div>
    <div class="detail-section">
      <div class="detail-section-title">데이터 출처</div>
      <div class="source-note">
        ${place.source==='public' ? '✅ 공공데이터포털 제공 (문화체육관광부)<br>실제 운영 여부는 업체에 직접 확인하세요.' : '🗺️ 카카오맵 기준 정보<br>실제 운영 여부는 업체에 직접 확인하세요.'}
      </div>
    </div>
    <div class="detail-actions">
      ${place.tel?`<button class="detail-action-btn" onclick="location.href='tel:${place.tel}'">📞 전화하기</button>`:'<button class="detail-action-btn" disabled style="opacity:0.4">전화 없음</button>'}
      ${place.kakaoUrl||place.homepage?`<button class="detail-action-btn" onclick="window.open('${place.kakaoUrl||place.homepage}','_blank')">🗺️ 지도 보기</button>`:'<div></div>'}
      <button class="detail-action-btn primary" onclick="openRegisterModal()">✏️ 정보 수정 제안</button>
    </div>`;

  document.getElementById('detail-panel').classList.add('open');
  renderList();
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detail-panel').classList.remove('open');
  renderList();
}

// ═══════════════════════════════
// 등록 모달
// ═══════════════════════════════
function openRegisterModal() {
  document.getElementById('register-modal').classList.add('open');
}
function closeRegisterModal() {
  document.getElementById('register-modal').classList.remove('open');
}

function toggleCheck(el) {
  el.classList.toggle('checked');
}

function onPriceTypeChange() {
  const type = document.getElementById('reg-price-type').value;
  document.getElementById('price-amount-group').style.opacity = type==='free' ? '0.4' : '1';
}

function previewPhotos(input) {
  const preview = document.getElementById('photo-preview');
  preview.innerHTML = '';
  [...input.files].slice(0,5).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'photo-thumb';
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const cat = document.getElementById('reg-category').value;
  const addr = document.getElementById('reg-address').value.trim();
  const manager = document.getElementById('reg-manager').value.trim();
  const managerTel = document.getElementById('reg-manager-tel').value.trim();
  if(!name||!cat||!addr||!manager||!managerTel) {
    showToast('⚠️ 필수 항목을 모두 입력해주세요');
    return;
  }
  closeRegisterModal();
  showToast('✅ 등록 신청이 완료되었습니다! 검토 후 반영됩니다.');
}

// ═══════════════════════════════
// 뷰 모드
// ═══════════════════════════════
function setView(mode) {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+mode).classList.add('active');
  const list = document.getElementById('list-panel');
  const map = document.getElementById('map-panel');
  if(mode==='split'){list.style.display='flex';map.style.display='block';list.style.width='380px';}
  else if(mode==='map'){list.style.display='none';map.style.display='block';}
  else{list.style.display='flex';map.style.display='none';list.style.width='100%';}
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
}

function toggleMobileMap() {
  mobileShowMap = !mobileShowMap;
  const list = document.getElementById('list-panel');
  const map = document.getElementById('map-panel');
  const fab = document.getElementById('mobile-fab');
  if(mobileShowMap){list.style.display='none';map.style.display='block';fab.textContent='📋';}
  else{list.style.display='flex';map.style.display='none';fab.textContent='🗺️';}
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ═══════════════════════════════
// 시작
// ═══════════════════════════════
window.addEventListener('resize',()=>{
  if(window.innerWidth<640){
    document.getElementById('mobile-fab').style.display='flex';
    if(!mobileShowMap){document.getElementById('map-panel').style.display='none';document.getElementById('list-panel').style.width='100%';}
  } else {
    document.getElementById('mobile-fab').style.display='none';
    setView(viewMode);
  }
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
});

if(window.innerWidth<640){
  document.getElementById('mobile-fab').style.display='flex';
  document.getElementById('map-panel').style.display='none';
}

initPublicData();
applyFiltersLocal();
document.getElementById('status-text').textContent = `${allPlaces.length.toLocaleString()}개 공공 장소 로드됨`;

if(typeof kakao!=='undefined'&&kakao.maps){
  kakao.maps.load(()=>initKakaoMap());
}
