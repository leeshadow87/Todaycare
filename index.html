<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘아이돌봄 v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=64378d75cc0d8edba55553350f36c7d1&libraries=services,clusterer"></script>
<style>
/* ── RESET & BASE ─────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#FF6B35;--brand2:#FF8C55;--brand-light:#FFF3EF;--brand-dark:#E85520;
  --green:#00B87A;--green-light:#E6F9F3;
  --teal:#0097A7;--teal-light:#E0F5F7;
  --blue:#2979FF;--blue-light:#EBF1FF;
  --purple:#7C4DFF;--purple-light:#F0EBFF;
  --bg:#F5F6FA;--surface:#FFFFFF;--surface2:#F9FAFB;
  --border:#EAEDF2;--border2:#F0F2F5;
  --text:#1A1D23;--text2:#5C6373;--text3:#9AA0AD;--text4:#C8CDD6;
  --shadow-sm:0 1px 4px rgba(0,0,0,0.06);
  --shadow:0 4px 20px rgba(0,0,0,0.09);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.13);
  --shadow-brand:0 4px 20px rgba(255,107,53,0.3);
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --header-h:56px;--filter-h:48px;--tab-h:52px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative}

/* ── HEADER ──────────────────────────────── */
.header{
  height:var(--header-h);background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;flex-shrink:0;z-index:200;
  box-shadow:0 1px 0 var(--border);
}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 2px 8px rgba(255,107,53,0.35);
  flex-shrink:0;
}
.logo-text{display:flex;flex-direction:column;gap:0}
.logo-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.4px;line-height:1.2}
.logo-sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:0}
.header-right{display:flex;align-items:center;gap:6px}
.badge-data{
  padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
  background:var(--green-light);color:var(--green);
}

/* ── SEARCH BAR ──────────────────────────── */
.search-wrap{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;flex-shrink:0;
}
.search-box{
  display:flex;align-items:center;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:0 14px;height:40px;
  transition:border-color 0.15s;
}
.search-box:focus-within{border-color:var(--brand);background:#fff}
.search-icon{font-size:16px;color:var(--text3);margin-right:8px;flex-shrink:0}
.search-input{
  flex:1;border:none;background:transparent;font-size:13.5px;
  font-family:'Pretendard',sans-serif;color:var(--text);outline:none;
}
.search-input::placeholder{color:var(--text4)}
.search-clear{
  width:20px;height:20px;border-radius:50%;background:var(--text4);
  border:none;cursor:pointer;display:none;align-items:center;justify-content:center;
  font-size:10px;color:#fff;flex-shrink:0;
}
.search-clear.show{display:flex}

/* ── FILTER TABS ─────────────────────────── */
.filter-wrap{
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;overflow:hidden;
}
/* 지역 필터 */
.region-row{
  display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;
  scrollbar-width:none;
}
.region-row::-webkit-scrollbar{display:none}
.region-btn{
  padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);background:#fff;color:var(--text2);
  cursor:pointer;white-space:nowrap;transition:all 0.15s;font-family:'Pretendard',sans-serif;
  flex-shrink:0;
}
.region-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.region-btn:hover:not(.active){border-color:var(--text3);color:var(--text)}
/* 카테고리 탭 */
.cat-row{
  display:flex;gap:0;padding:6px 16px 8px;overflow-x:auto;
  scrollbar-width:none;
}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{
  display:flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
  border:1.5px solid var(--border);background:#fff;color:var(--text2);
  cursor:pointer;white-space:nowrap;transition:all 0.15s;
  font-family:'Pretendard',sans-serif;flex-shrink:0;margin-right:6px;
}
.cat-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.5}
.cat-chip.active{border-width:1.5px}
.cat-chip.active .dot{opacity:1}
.cat-chip[data-cat="all"].active{background:var(--brand);color:#fff;border-color:var(--brand)}
.cat-chip[data-cat="support"].active{background:var(--green-light);color:var(--green);border-color:var(--green)}
.cat-chip[data-cat="public"].active{background:var(--brand-light);color:var(--brand);border-color:var(--brand)}
.cat-chip[data-cat="childcare"].active{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}
.cat-chip[data-cat="daytime"].active{background:var(--teal-light);color:var(--teal);border-color:var(--teal)}

/* ── MAIN LAYOUT ─────────────────────────── */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* ── LIST PANEL ──────────────────────────── */
.list-panel{
  width:360px;min-width:280px;
  display:flex;flex-direction:column;
  background:var(--bg);flex-shrink:0;
  border-right:1px solid var(--border);
}
.list-meta{
  padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.list-count{font-size:12px;color:var(--text3);font-weight:500}
.list-count strong{color:var(--text);font-weight:700}
.view-toggle{display:flex;gap:3px}
.vtbtn{
  padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;
  border:1.5px solid var(--border);background:#fff;color:var(--text3);
  cursor:pointer;font-family:'Pretendard',sans-serif;transition:all 0.12s;
}
.vtbtn.active{background:var(--text);color:#fff;border-color:var(--text)}
.list-scroll{flex:1;overflow-y:auto;padding:0 12px 12px;scroll-behavior:smooth}
.list-scroll::-webkit-scrollbar{width:3px}
.list-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── PLACE CARD ──────────────────────────── */
.place-card{
  background:var(--surface);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:8px;cursor:pointer;
  border:1.5px solid transparent;
  box-shadow:var(--shadow-sm);
  transition:all 0.15s;
  position:relative;overflow:hidden;
}
.place-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;border-radius:3px 0 0 3px;
  background:transparent;transition:background 0.15s;
}
.place-card:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
.place-card.selected{border-color:var(--brand);box-shadow:0 2px 16px rgba(255,107,53,0.18)}
.place-card.selected::before{background:var(--brand)}

/* 카테고리별 액센트 */
.place-card[data-cat="support"]::before{background:var(--green)}
.place-card[data-cat="public"]::before{background:var(--brand)}
.place-card[data-cat="childcare"]::before{background:var(--blue)}
.place-card[data-cat="daytime"]::before{background:var(--teal)}
.place-card:not(.selected){border-left:none}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-name{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.35;flex:1}
.card-tag{
  padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;
  white-space:nowrap;flex-shrink:0;letter-spacing:0.2px;
}
.tag-support{background:var(--green-light);color:var(--green)}
.tag-public{background:var(--brand-light);color:var(--brand)}
.tag-childcare{background:var(--blue-light);color:var(--blue)}
.tag-daytime{background:var(--teal-light);color:var(--teal)}

.card-addr{
  font-size:11.5px;color:var(--text3);
  display:flex;align-items:center;gap:4px;margin-bottom:5px;
}
.card-addr-icon{font-size:11px;flex-shrink:0}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.card-badge{
  padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;
  background:var(--bg);color:var(--text3);border:1px solid var(--border);
}
.card-badge.free{background:#E6F9F3;color:var(--green);border-color:transparent}
.card-badge.care{background:var(--brand-light);color:var(--brand);border-color:transparent}
.card-badge.geo{background:#FFF8E1;color:#F59E0B;border-color:transparent}

/* 빈 상태 */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--text3);text-align:center;
}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.6}
.empty-text{font-size:14px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:12.5px;color:var(--text3)}

/* ── MAP ─────────────────────────────────── */
.map-panel{flex:1;position:relative;overflow:hidden}
#kakao-map{width:100%;height:100%}
.map-overlay{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:10}
.map-btn{
  padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;
  background:#fff;color:var(--text);border:none;cursor:pointer;
  box-shadow:var(--shadow);font-family:'Pretendard',sans-serif;
  display:flex;align-items:center;gap:5px;transition:all 0.15s;white-space:nowrap;
}
.map-btn:hover{background:var(--brand);color:#fff}
.map-btn.active{background:var(--brand);color:#fff}
.map-legend{
  position:absolute;bottom:12px;left:12px;
  background:#fff;border-radius:10px;padding:8px 12px;
  box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap;
  font-size:11px;color:var(--text2);
}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── DETAIL PANEL ────────────────────────── */
.detail-panel{
  position:absolute;left:360px;top:0;width:340px;height:100%;
  background:var(--surface);border-right:1px solid var(--border);
  z-index:50;transform:translateX(-700px);transition:transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
  overflow-y:auto;display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,0.09);
}
.detail-panel.open{transform:translateX(0)}
.detail-panel::-webkit-scrollbar{width:3px}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border)}

.detail-hero{
  padding:20px 20px 16px;background:var(--surface);
  border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:10;
}
.detail-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.detail-title{font-size:16px;font-weight:800;color:var(--text);line-height:1.3;flex:1}
.btn-close{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);flex-shrink:0;transition:all 0.12s;
}
.btn-close:hover{background:var(--bg)}
.detail-tag-row{display:flex;gap:6px;flex-wrap:wrap}
.detail-tag{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
}

.detail-body{padding:16px 20px;flex:1}
.detail-section{margin-bottom:18px}
.detail-section-title{
  font-size:10.5px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;
}
.detail-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.detail-icon{font-size:14px;flex-shrink:0;margin-top:1px;width:18px;text-align:center}
.detail-val{font-size:13px;color:var(--text);flex:1;line-height:1.45}
.detail-val a{color:var(--brand);text-decoration:none}
.detail-val a:hover{text-decoration:underline}
.detail-val.muted{color:var(--text3)}

.geo-notice{
  background:#FFF8E1;border:1px solid #FDE68A;border-radius:10px;
  padding:10px 12px;font-size:12px;color:#92400E;margin-bottom:14px;
  display:flex;gap:8px;align-items:flex-start;
}

.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.det-btn{
  padding:11px;border-radius:10px;font-size:12.5px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);
  font-family:'Pretendard',sans-serif;transition:all 0.15s;text-align:center;
}
.det-btn:hover{border-color:var(--brand);color:var(--brand)}
.det-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);grid-column:1/-1}
.det-btn.primary:hover{background:var(--brand-dark)}

/* ── MOBILE ──────────────────────────────── */
.mobile-fab{
  display:none;position:fixed;bottom:calc(20px + var(--safe-bottom));right:20px;
  z-index:300;width:52px;height:52px;border-radius:50%;
  background:var(--brand);color:#fff;border:none;font-size:22px;
  cursor:pointer;box-shadow:var(--shadow-brand);
  align-items:center;justify-content:center;transition:all 0.2s;
}
.mobile-fab:active{transform:scale(0.92)}

/* ── BOTTOM SHEET (모바일) ───────────────── */
.bottom-sheet{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-radius:20px 20px 0 0;
  box-shadow:0 -4px 30px rgba(0,0,0,0.13);
  z-index:400;transform:translateY(100%);
  transition:transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  max-height:70dvh;overflow:hidden;display:flex;flex-direction:column;
}
.bottom-sheet.open{transform:translateY(0)}
.bs-handle{
  width:36px;height:4px;background:var(--text4);border-radius:2px;
  margin:10px auto 0;flex-shrink:0;
}
.bs-header{
  padding:12px 20px 10px;border-bottom:1px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.bs-title{font-size:15px;font-weight:800;color:var(--text)}
.bs-scroll{overflow-y:auto;flex:1;padding:8px 12px 20px}
.bs-scroll::-webkit-scrollbar{display:none}

/* ── TOAST ───────────────────────────────── */
.toast{
  position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
  transform:translateX(-50%) translateY(12px);
  background:#1A1D23;color:#fff;padding:10px 18px;
  border-radius:10px;font-size:13px;font-weight:500;
  z-index:9999;opacity:0;transition:all 0.22s;pointer-events:none;
  white-space:nowrap;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING ─────────────────────────────── */
.loading-overlay{
  position:fixed;inset:0;background:rgba(245,246,250,0.85);
  z-index:1000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  backdrop-filter:blur(3px);
}
.loading-spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--brand);border-radius:50%;
  animation:spin 0.7s linear infinite;
}
.loading-text{font-size:13px;color:var(--text2);font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── GEOCODE PROGRESS ────────────────────── */
.geo-bar{
  position:fixed;bottom:0;left:0;right:0;height:3px;
  background:var(--border);z-index:500;
}
.geo-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));
  width:0;transition:width 0.3s ease;
}

/* ── RESPONSIVE ──────────────────────────── */
@media(max-width:640px){
  .list-panel{display:none}
  .map-panel{display:flex!important;width:100%}
  .detail-panel{width:100%;left:0;transform:translateY(100%)}
  .detail-panel.open{transform:translateY(0)}
  .mobile-fab{display:flex}
  .bottom-sheet{display:flex}
}
@media(min-width:641px) and (max-width:900px){
  .list-panel{width:300px}
  .detail-panel{left:300px;width:300px}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-mark">🧸</div>
    <div class="logo-text">
      <div class="logo-title">오늘아이돌봄</div>
      <div class="logo-sub">수도권 돌봄 공간 지도</div>
    </div>
  </div>
  <div class="header-right">
    <span class="badge-data">📋 428개 시설</span>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" type="text"
      placeholder="시설명 또는 지역으로 검색..."
      oninput="onSearch(this.value)"
      autocomplete="off" autocorrect="off">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-wrap">
  <div class="region-row" id="region-row">
    <button class="region-btn active" data-sido="" onclick="setSido(this)">전체</button>
    <button class="region-btn" data-sido="서울특별시" onclick="setSido(this)">서울</button>
    <button class="region-btn" data-sido="경기도" onclick="setSido(this)">경기</button>
    <button class="region-btn" data-sido="인천광역시" onclick="setSido(this)">인천</button>
  </div>
  <div class="cat-row">
    <button class="cat-chip active" data-cat="all" onclick="setCat(this)">
      <span class="dot"></span>전체
    </button>
    <button class="cat-chip" data-cat="support" onclick="setCat(this)">
      <span class="dot"></span>🏠 육아지원·나눔터
    </button>
    <button class="cat-chip" data-cat="public" onclick="setCat(this)">
      <span class="dot"></span>🏛️ 서울형키즈카페
    </button>
    <button class="cat-chip" data-cat="childcare" onclick="setCat(this)">
      <span class="dot"></span>👶 시간제보육
    </button>
    <button class="cat-chip" data-cat="daytime" onclick="setCat(this)">
      <span class="dot"></span>👴 경로당낮돌봄
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LIST -->
  <div class="list-panel" id="list-panel">
    <div class="list-meta">
      <span class="list-count" id="list-count"><strong>0</strong>개 시설</span>
      <div class="view-toggle">
        <button class="vtbtn active" onclick="setView('split')" id="v-split">분할</button>
        <button class="vtbtn" onclick="setView('map')" id="v-map">지도</button>
        <button class="vtbtn" onclick="setView('list')" id="v-list">목록</button>
      </div>
    </div>
    <div class="list-scroll" id="list-scroll"></div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-hero" id="detail-hero"></div>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <!-- MAP -->
  <div class="map-panel" id="map-panel">
    <div id="kakao-map"></div>
    <div class="map-overlay">
      <button class="map-btn active" id="cluster-btn" onclick="toggleCluster()">
        🔵 클러스터
      </button>
      <button class="map-btn" onclick="fitBounds()">📍 전체보기</button>
    </div>
    <div class="map-legend" id="map-legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>육아지원</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--brand)"></div>키즈카페</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>시간제보육</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--teal)"></div>경로당</div>
    </div>
  </div>

let kakaoMap=null, markers=[], clusterer=null, clusterOn=true;
let mapReady=false, mobileShowMap=false, viewMode='split', selectedId=null;
let filters={sido:'',cat:'',keyword:''};
let allPlaces=[...RAW_DATA];
let displayPlaces=[];
let geoQueue=[], geoRunning=false, geoTotal=0, geoDone=0;

// ═══════════════════════════════════════════════
// GEOCODING (카카오 주소 → 좌표)
// ═══════════════════════════════════════════════
function startGeocoding(){
  const need = allPlaces.filter(p=>!p.lat||!p.lng);
  if(!need.length) return;
  geoQueue = [...need];
  geoTotal = need.length;
  geoDone = 0;
  document.getElementById('geo-bar').style.display='block';
  showToast(`📍 좌표 변환 중... (${geoTotal}개)`);
  processGeoQueue();
}

function processGeoQueue(){
  if(!mapReady||!geoQueue.length){
    if(!geoQueue.length){
      document.getElementById('geo-bar').style.display='none';
      showToast(`✅ 좌표 변환 완료`);
      applyFilters();
      updateMarkers();
    }
    return;
  }
  geoRunning=true;
  const ps = new kakao.maps.services.Geocoder();
  
  function processNext(){
    if(!geoQueue.length){
      geoRunning=false;
      document.getElementById('geo-bar').style.display='none';
      applyFilters();
      updateMarkers();
      return;
    }
    const place = geoQueue.shift();
    ps.addressSearch(place.address, (result, status)=>{
      if(status===kakao.maps.services.Status.OK){
        place.lat=parseFloat(result[0].y);
        place.lng=parseFloat(result[0].x);
      }
      geoDone++;
      const pct=(geoDone/geoTotal*100).toFixed(0);
      document.getElementById('geo-fill').style.width=pct+'%';
      setTimeout(processNext, 50);
    });
  }
  processNext();
}

// ═══════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════
function setSido(el){
  filters.sido = el.dataset.sido;
  document.querySelectorAll('.region-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
  updateMarkers();
}

function setCat(el){
  filters.cat = el.dataset.cat==='all'?'':el.dataset.cat;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
  updateMarkers();
}

function onSearch(v){
  filters.keyword = v.trim().toLowerCase();
  document.getElementById('search-clear').classList.toggle('show', v.length>0);
  applyFilters();
}

function clearSearch(){
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').classList.remove('show');
  filters.keyword='';
  applyFilters();
}

function applyFilters(){
  let res = [...allPlaces];
  if(filters.sido) res=res.filter(p=>p.sido===filters.sido);
  if(filters.cat) res=res.filter(p=>p.category===filters.cat);
  if(filters.keyword) res=res.filter(p=>
    p.name.toLowerCase().includes(filters.keyword)||
    (p.address||'').toLowerCase().includes(filters.keyword)||
    (p.sigungu||'').includes(filters.keyword)
  );
  displayPlaces=res;
  renderList();
  const cnt=document.getElementById('list-count');
  cnt.innerHTML=`<strong>${res.length.toLocaleString()}</strong>개 시설`;
}

// ═══════════════════════════════════════════════
// RENDER LIST
// ═══════════════════════════════════════════════
function renderList(){
  const el = document.getElementById('list-scroll');
  const bs = document.getElementById('bs-scroll');
  
  if(!displayPlaces.length){
    const html=`<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">검색 결과가 없어요</div>
      <div class="empty-sub">다른 검색어나 지역을 선택해보세요</div>
    </div>`;
    el.innerHTML=html; bs.innerHTML=html; return;
  }
  
  const html = displayPlaces.map(p=>cardHTML(p)).join('');
  el.innerHTML=html;
  if(window.innerWidth<=640) bs.innerHTML=html;
}

function cardHTML(p){
  const isGeo = !p.lat||!p.lng;
  const subLabel = SUB_LABEL[p.subcategory]||p.subcategory||'';
  const catTag = p.category;
  const addr = p.sigungu ? `${p.sigungu} · ${p.address.replace(p.sido,'').replace('특별시','시').trim().substring(0,28)}` : (p.address||'').substring(0,32);
  
  let badges = '';
  if(p.fee_type==='free') badges+=`<span class="card-badge free">무료</span>`;
  if(p.care_available) badges+=`<span class="card-badge care">돌봄가능</span>`;
  if(isGeo) badges+=`<span class="card-badge geo">좌표변환중</span>`;
  
  const sel = selectedId===p.id?' selected':'';
  return `<div class="place-card${sel}" data-cat="${catTag}" data-id="${p.id}" onclick="selectPlace('${p.id}')">
    <div class="card-top">
      <div class="card-name">${p.name}</div>
      <span class="card-tag tag-${catTag}">${CAT_EMOJI[catTag]||''} ${subLabel}</span>
    </div>
    <div class="card-addr"><span class="card-addr-icon">📍</span>${addr}</div>
    ${badges?`<div class="card-badges">${badges}</div>`:''}
  </div>`;
}

// ═══════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════
function selectPlace(id){
  selectedId=id;
  const p = allPlaces.find(x=>x.id===id);
  if(!p) return;
  
  renderList();
  
  // 지도 이동
  if(mapReady && p.lat && p.lng){
    const pos = new kakao.maps.LatLng(p.lat,p.lng);
    kakaoMap.panTo(pos);
  }
  
  const isGeo=!p.lat||!p.lng;
  const subLabel=SUB_LABEL[p.subcategory]||p.subcategory||'';
  
  // Hero
  document.getElementById('detail-hero').innerHTML=`
    <div class="detail-hero-top">
      <div class="detail-title">${p.name}</div>
      <button class="btn-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-tag-row">
      <span class="detail-tag tag-${p.category}">${CAT_EMOJI[p.category]||''} ${subLabel}</span>
      ${p.fee_type==='free'?'<span class="detail-tag" style="background:var(--green-light);color:var(--green)">무료</span>':''}
      ${p.care_available?'<span class="detail-tag" style="background:var(--brand-light);color:var(--brand)">돌봄가능</span>':''}
    </div>`;
  
  // Body
  let body='';
  if(isGeo) body+=`<div class="geo-notice">⚠️ 현재 좌표 변환 중입니다. 지도에 곧 표시됩니다.</div>`;
  
  body+=`<div class="detail-section">
    <div class="detail-section-title">📍 위치 정보</div>
    <div class="detail-row"><div class="detail-icon">🏠</div><div class="detail-val">${p.address||'-'}</div></div>
    ${p.sigungu?`<div class="detail-row"><div class="detail-icon">🗺️</div><div class="detail-val">${p.sido} ${p.sigungu}</div></div>`:''}
  </div>`;
  
  if(p.tel||p.weekday||p.closed||p.target_age){
    body+=`<div class="detail-section">
      <div class="detail-section-title">ℹ️ 이용 정보</div>
      ${p.tel?`<div class="detail-row"><div class="detail-icon">📞</div><div class="detail-val"><a href="tel:${p.tel}">${p.tel}</a></div></div>`:''}
      ${p.weekday?`<div class="detail-row"><div class="detail-icon">⏰</div><div class="detail-val">${p.weekday}</div></div>`:''}
      ${p.closed?`<div class="detail-row"><div class="detail-icon">🚪</div><div class="detail-val muted">휴관: ${p.closed}</div></div>`:''}
      ${p.target_age?`<div class="detail-row"><div class="detail-icon">👶</div><div class="detail-val">이용연령: ${p.target_age}</div></div>`:''}
    </div>`;
  }
  
  if(p.homepage){
    body+=`<div class="detail-section">
      <div class="detail-section-title">🔗 온라인</div>
      <div class="detail-row"><div class="detail-icon">🌐</div>
        <div class="detail-val"><a href="${p.homepage}" target="_blank">홈페이지 바로가기</a></div>
      </div>
    </div>`;
  }
  
  body+=`<div class="detail-section">
    <div class="detail-section-title">📋 데이터 출처</div>
    <div class="detail-row"><div class="detail-icon">✅</div>
      <div class="detail-val muted">${p.source==='public'?'공공데이터 (정부 제공)':'카카오맵 기준 정보'}<br>${p.last_checked||''} 기준</div>
    </div>
  </div>`;
  
  // Actions
  body+=`<div class="detail-actions">
    ${p.tel?`<button class="det-btn" onclick="location.href='tel:${p.tel}'">📞 전화</button>`:'<button class="det-btn" disabled style="opacity:0.4">전화없음</button>'}
    ${p.lat&&p.lng?`<button class="det-btn" onclick="openKakaoMap(${p.lat},${p.lng},'${p.name.replace(/'/g,'')}')">🗺️ 길찾기</button>`:'<button class="det-btn" disabled style="opacity:0.4">위치확인중</button>'}
    <button class="det-btn primary" onclick="sharePlace('${p.id}')">📤 공유하기</button>
  </div>`;
  
  document.getElementById('detail-body').innerHTML=body;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail(){
  selectedId=null;
  document.getElementById('detail-panel').classList.remove('open');
  renderList();
}

function openKakaoMap(lat,lng,name){
  window.open(`https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`,'_blank');
}

function sharePlace(id){
  const p=allPlaces.find(x=>x.id===id);
  if(!p) return;
  const txt=`${p.name}\n주소: ${p.address}${p.tel?'\n전화: '+p.tel:''}`;
  if(navigator.share){
    navigator.share({title:p.name, text:txt}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(txt).then(()=>showToast('📋 클립보드에 복사됐어요'));
  }
}

// ═══════════════════════════════════════════════
// KAKAO MAP
// ═══════════════════════════════════════════════
function initKakaoMap(){
  const cont=document.getElementById('kakao-map');
  kakaoMap=new kakao.maps.Map(cont,{
    center:new kakao.maps.LatLng(37.566,126.978), level:8
  });
  kakaoMap.setMaxLevel(12);
  
  clusterer=new kakao.maps.MarkerClusterer({
    map:kakaoMap, averageCenter:true, minLevel:5,
    disableClickZoom:false,
    styles:[
      {width:'44px',height:'44px',background:'rgba(255,107,53,0.88)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'44px',fontSize:'13px',fontWeight:'800',fontFamily:"'Pretendard',sans-serif",boxShadow:'0 2px 10px rgba(255,107,53,0.4)'},
      {width:'52px',height:'52px',background:'rgba(255,107,53,0.92)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'52px',fontSize:'14px',fontWeight:'800',fontFamily:"'Pretendard',sans-serif",boxShadow:'0 3px 14px rgba(255,107,53,0.45)'},
      {width:'60px',height:'60px',background:'rgba(220,80,10,0.95)',borderRadius:'50%',color:'#fff',textAlign:'center',lineHeight:'60px',fontSize:'15px',fontWeight:'800',fontFamily:"'Pretendard',sans-serif",boxShadow:'0 4px 18px rgba(220,80,10,0.5)'}
    ]
  });
  
  mapReady=true;
  applyFilters();
  updateMarkers();
  startGeocoding();
}

function makeMarkerSVG(color){
  return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="26" height="32" viewBox="0 0 26 32"><path d="M13 0C6 0 0 6 0 13c0 10 13 19 13 19S26 23 26 13C26 6 20 0 13 0z" fill="${color}" stroke="white" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="white" opacity="0.9"/></svg>`)}`;
}

function updateMarkers(){
  if(!mapReady) return;
  markers.forEach(m=>m.setMap(null)); markers=[];
  if(clusterer) clusterer.clear();
  
  const withCoord=displayPlaces.filter(p=>p.lat&&p.lng);
  
  withCoord.forEach(p=>{
    const color=CAT_COLOR[p.category]||'#888';
    const img=new kakao.maps.MarkerImage(
      makeMarkerSVG(color),
      new kakao.maps.Size(26,32),
      {offset:new kakao.maps.Point(13,32)}
    );
    const m=new kakao.maps.Marker({
      position:new kakao.maps.LatLng(p.lat,p.lng),
      image:img, title:p.name
    });
    kakao.maps.event.addListener(m,'click',()=>selectPlace(p.id));
    markers.push(m);
  });
  
  if(clusterOn){
    clusterer.addMarkers(markers);
  } else {
    markers.forEach(m=>m.setMap(kakaoMap));
  }
}

function toggleCluster(){
  clusterOn=!clusterOn;
  const btn=document.getElementById('cluster-btn');
  btn.classList.toggle('active',clusterOn);
  btn.textContent=clusterOn?'🔵 클러스터':'⚪ 클러스터';
  if(clusterOn){
    markers.forEach(m=>m.setMap(null));
    clusterer.addMarkers(markers);
  } else {
    clusterer.clear();
    markers.forEach(m=>m.setMap(kakaoMap));
  }
}

function fitBounds(){
  if(!mapReady||!markers.length) return;
  const bounds=new kakao.maps.LatLngBounds();
  markers.forEach(m=>bounds.extend(m.getPosition()));
  kakaoMap.setBounds(bounds);
}

// ═══════════════════════════════════════════════
// VIEW MODE
// ═══════════════════════════════════════════════
function setView(mode){
  viewMode=mode;
  ['split','map','list'].forEach(v=>{
    document.getElementById('v-'+v).classList.toggle('active',v===mode);
  });
  const list=document.getElementById('list-panel');
  const map=document.getElementById('map-panel');
  if(mode==='split'){list.style.display='flex';map.style.display='block'}
  else if(mode==='map'){list.style.display='none';map.style.display='block'}
  else{list.style.display='flex';map.style.display='none';list.style.width='100%'}
  if(mode!=='list') list.style.width='';
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
}

// ═══════════════════════════════════════════════
// MOBILE
// ═══════════════════════════════════════════════
function toggleMobileMap(){
  mobileShowMap=!mobileShowMap;
  const list=document.getElementById('list-panel');
  const map=document.getElementById('map-panel');
  const fab=document.getElementById('mobile-fab');
  const bs=document.getElementById('bottom-sheet');
  if(mobileShowMap){
    map.style.display='block';
    fab.textContent='📋';
    bs.classList.remove('open');
  } else {
    map.style.display='none';
    fab.textContent='🗺️';
  }
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
}

function showBs(){
  renderList();
  document.getElementById('bs-title').textContent=`시설 목록 (${displayPlaces.length}개)`;
  document.getElementById('bottom-sheet').classList.add('open');
}
function closeBs(){
  document.getElementById('bottom-sheet').classList.remove('open');
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('resize',()=>{
  const isMobile=window.innerWidth<=640;
  document.getElementById('mobile-fab').style.display=isMobile?'flex':'none';
  if(!isMobile){
    document.getElementById('map-panel').style.display='block';
    document.getElementById('bottom-sheet').classList.remove('open');
  }
  if(kakaoMap) setTimeout(()=>kakaoMap.relayout(),150);
});

// 모바일 초기 설정
if(window.innerWidth<=640){
  document.getElementById('mobile-fab').style.display='flex';
  document.getElementById('map-panel').style.display='none';
  // 바텀시트에서 목록 표시하는 FAB 역할도
  document.getElementById('mobile-fab').addEventListener('click',()=>{
    if(!mobileShowMap) showBs();
  });
}

applyFilters();

if(typeof kakao!=='undefined'&&kakao.maps){
  kakao.maps.load(()=>initKakaoMap());
}

// 좌표 변환 완료 시 마커 갱신 (인터벌)
setInterval(()=>{
  if(mapReady && geoRunning) updateMarkers();
},2000);
</script>
</body>
</html>
